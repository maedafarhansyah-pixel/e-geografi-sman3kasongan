<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Atmosphere Mission — game edukasi atmosfer dengan Tactical HUD: 40 soal, 5 lapisan, achievement, dan visual canggih." />
<meta name="theme-color" content="#0b1026" />
<meta name="color-scheme" content="dark" />
<title>🌍 Atmosphere Mission — Tactical Edition</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌍%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --panel:rgba(255,255,255,.045);
    --panel2:rgba(255,255,255,.08);
    --border:rgba(255,255,255,.14);
    --text:#e6ecff;
    --muted:#9aa4c5;
    --accent:#63e6ff;
    --accent2:#a78bfa;
    --good:#34d399;
    --bad:#f87171;
    --warn:#fbbf24;
    --unk:#facc15;
    --radius:14px;
    --shadow:0 12px 40px rgba(0,0,0,.5);
    --hud:#63e6ff;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{background:#03060d;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}

  /* ============ LAYERED BACKGROUNDS ============ */
  #sky{position:fixed;inset:0;z-index:-3;transition:background 1.6s cubic-bezier(.4,0,.2,1);background:radial-gradient(1200px 800px at 80% -10%,#1a2350 0%,transparent 60%),radial-gradient(900px 700px at -10% 110%,#1c1740 0%,transparent 55%),#0b1026}
  #sky[data-level="troposfer"]{background:radial-gradient(900px 500px at 80% 0%,rgba(255,200,120,.15) 0%,transparent 60%),linear-gradient(180deg,#0b1026 0%,#1e3a5f 55%,#3a6a8f 100%)}
  #sky[data-level="stratosfer"]{background:radial-gradient(900px 500px at 50% 0%,rgba(99,230,255,.12) 0%,transparent 60%),linear-gradient(180deg,#06122e 0%,#0b2050 55%,#123a7a 100%)}
  #sky[data-level="mesosfer"]{background:radial-gradient(900px 500px at 30% 10%,rgba(167,139,250,.15) 0%,transparent 60%),linear-gradient(180deg,#0a0a2a 0%,#1a0f3f 55%,#2a1555 100%)}
  #sky[data-level="termosfer"]{background:radial-gradient(700px 400px at 20% 20%,rgba(52,211,153,.22) 0%,transparent 60%),radial-gradient(700px 400px at 80% 30%,rgba(167,139,250,.2) 0%,transparent 60%),linear-gradient(180deg,#000510 0%,#001a3a 40%,#003a5a 70%,#005a4a 100%)}
  #sky[data-level="eksosfer"]{background:radial-gradient(ellipse at 50% 130%,#1a1a40 0%,#050510 45%,#000000 100%)}

  /* Starfield base */
  #starfield{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
  /* Particle layer per environment */
  #particles{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
  /* FX layer (confetti) */
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}

  /* ============ SCANLINE OVERLAY ============ */
  .scanlines{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:.06;background:repeating-linear-gradient(0deg,transparent 0px,transparent 2px,rgba(255,255,255,.4) 2px,rgba(255,255,255,.4) 3px);mix-blend-mode:overlay}
  @media (prefers-reduced-motion: no-preference){
    .scanlines::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(99,230,255,.05) 50%,transparent 100%);height:200px;animation:scan 6s linear infinite}
    @keyframes scan{0%{transform:translateY(-200px)}100%{transform:translateY(100vh)}}
  }

  /* ============ SCI-FI FRAME ============ */
  .hud-frame{position:fixed;inset:10px;z-index:54;pointer-events:none;border-radius:8px}
  .hud-frame .corner{position:absolute;width:24px;height:24px;border-color:var(--hud);border-style:solid;opacity:.6;filter:drop-shadow(0 0 6px var(--hud))}
  .hud-frame .tl{top:0;left:0;border-width:2px 0 0 2px}
  .hud-frame .tr{top:0;right:0;border-width:2px 2px 0 0}
  .hud-frame .bl{bottom:0;left:0;border-width:0 0 2px 2px}
  .hud-frame .br{bottom:0;right:0;border-width:0 2px 2px 0}

  /* ============ ALTIMETER (kiri) ============ */
  .altimeter{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:53;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;opacity:0;transition:opacity .5s ease}
  .altimeter.show{opacity:1}
  .alt-track{position:relative;width:6px;height:min(60vh,420px);border-radius:999px;background:linear-gradient(180deg,#63e6ff 0%,#a78bfa 25%,#f472b6 50%,#fbbf24 75%,#34d399 100%);box-shadow:0 0 24px rgba(99,230,255,.35);overflow:hidden}
  .alt-track::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0px,transparent 8px,rgba(0,0,0,.4) 8px,rgba(0,0,0,.4) 9px)}
  .alt-marker{position:absolute;left:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--hud);box-shadow:0 0 14px var(--hud);transition:top .9s cubic-bezier(.5,0,.2,1);top:100%}
  .alt-rocket{position:absolute;left:50%;transform:translate(-50%,-50%);font-size:16px;transition:top .9s cubic-bezier(.5,0,.2,1);top:100%;filter:drop-shadow(0 0 8px var(--hud))}
  .alt-label{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--hud);text-shadow:0 0 8px var(--hud);font-variant-numeric:tabular-nums;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:8px;border:1px solid rgba(99,230,255,.35)}
  .alt-tick{position:absolute;right:-10px;font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.5px;transform:translateY(-50%);white-space:nowrap;text-shadow:0 0 4px #000}
  @media (max-width:600px){ .altimeter{display:none} }

  /* ============ SOUND VISUALIZER (kanan bawah) ============ */
  .visualizer{position:fixed;right:14px;bottom:14px;z-index:53;display:flex;align-items:flex-end;gap:3px;height:26px;padding:5px 8px;background:rgba(13,19,48,.7);border:1px solid rgba(99,230,255,.3);border-radius:10px;backdrop-filter:blur(8px);opacity:0;transition:opacity .4s}
  .visualizer.show{opacity:1}
  .visualizer span{display:block;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:2px;animation:viz 1s ease-in-out infinite}
  .visualizer span:nth-child(1){animation-delay:0s}
  .visualizer span:nth-child(2){animation-delay:.15s}
  .visualizer span:nth-child(3){animation-delay:.3s}
  .visualizer span:nth-child(4){animation-delay:.45s}
  .visualizer span:nth-child(5){animation-delay:.6s}
  @keyframes viz{0%,100%{height:3px}50%{height:18px}}
  .visualizer.paused span{animation-play-state:paused;height:3px}
  @media (max-width:600px){ .visualizer{display:none} }

  /* ============ BOOT / LOADING SCREEN ============ */
  .boot{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 50%,#0a1530 0%,#03060d 70%);display:grid;place-items:center;opacity:1;transition:opacity .8s ease;overflow:hidden}
  .boot.hidden{opacity:0;pointer-events:none}
  .boot-inner{display:flex;flex-direction:column;align-items:center;gap:26px;position:relative;z-index:2}
  .planet{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#63e6ff 0%,#3b82f6 30%,#1e3a8a 60%,#0b1026 100%);box-shadow:0 0 80px rgba(99,230,255,.5),inset -12px -12px 40px rgba(0,0,0,.7),inset 8px 8px 24px rgba(255,255,255,.15);position:relative;animation:spinPlanet 12s linear infinite}
  .planet::after{content:'';position:absolute;top:-18px;left:-28px;right:-28px;bottom:-18px;border-radius:50%;border:2px solid transparent;background:linear-gradient(135deg,rgba(99,230,255,.5),rgba(167,139,250,.5)) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;transform:rotate(-25deg);animation:spinRing 8s linear infinite}
  @keyframes spinPlanet{0%{background-position:0 0}100%{background-position:220px 0}}
  @keyframes spinRing{0%{transform:rotate(-25deg) rotateZ(0deg)}100%{transform:rotate(-25deg) rotateZ(360deg)}}
  .boot-text{font-size:13px;letter-spacing:5px;font-weight:800;color:var(--accent);text-shadow:0 0 20px var(--hud);text-align:center}
  .boot-sub{font-size:10px;letter-spacing:3px;color:var(--muted);margin-top:-18px}
  .boot-bar{width:min(320px,70vw);height:3px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .boot-bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 12px var(--hud);transition:width .3s ease}

  /* ============ WRAP ============ */
  .wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:16px 16px 64px}

  /* ============ HUD (top bar) ============ */
  .hud{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;margin:8px 0 22px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(12px);flex-wrap:wrap;box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08)}
  .hud::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,var(--hud),transparent);opacity:.7;animation:hudLine 4s ease-in-out infinite}
  @keyframes hudLine{0%,100%{transform:translateX(-20%);opacity:.3}50%{transform:translateX(20%);opacity:.9}}
  .hud-left{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{font-size:28px;filter:drop-shadow(0 0 12px rgba(99,230,255,.6));animation:logoFloat 4s ease-in-out infinite}
  @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .hud-title{font-weight:800;letter-spacing:1px;font-size:13px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hud-sub{font-size:10.5px;color:var(--muted);letter-spacing:.5px}
  .hud-right{display:flex;align-items:center;gap:10px}
  .xp{font-size:12px;font-weight:800;color:var(--accent);min-width:64px;text-align:right;font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(99,230,255,.5)}
  .xpbar{width:120px;height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(99,230,255,.2);position:relative}
  #xpFill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 12px rgba(99,230,255,.6);position:relative}
  #xpFill::after{content:'';position:absolute;top:0;right:0;bottom:0;width:20px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8));animation:xpShine 2s ease-in-out infinite}
  @keyframes xpShine{0%,100%{opacity:0}50%{opacity:1}}
  .avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,rgba(99,230,255,.15),rgba(167,139,250,.15));border:1px solid rgba(99,230,255,.35);transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .4s ease;flex-shrink:0;box-shadow:0 0 16px rgba(99,230,255,.2)}
  .avatar.bump{transform:scale(1.25) rotate(-8deg);box-shadow:0 0 32px rgba(251,191,36,.85)}
  .iconbtn{width:34px;height:34px;border-radius:10px;background:var(--panel);color:var(--text);border:1px solid var(--border);cursor:pointer;font-size:15px;display:grid;place-items:center;transition:all .15s ease}
  .iconbtn:hover{background:var(--panel2);border-color:rgba(99,230,255,.5);box-shadow:0 0 12px rgba(99,230,255,.3)}

  /* ============ BUTTONS ============ */
  .btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:12px;border:1px solid transparent;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:.3px;transition:all .15s ease;font-family:inherit;overflow:hidden}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04122b;box-shadow:0 8px 24px rgba(99,230,255,.3),inset 0 1px 0 rgba(255,255,255,.4)}
  .btn-primary::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-100%);transition:transform .6s}
  .btn-primary:hover::before{transform:translateX(100%)}
  .btn-primary:hover{box-shadow:0 10px 32px rgba(99,230,255,.55)}
  .btn-ghost{background:var(--panel);border-color:var(--border);color:var(--text)}
  .btn-ghost:hover{background:var(--panel2);border-color:rgba(99,230,255,.4)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

  /* ============ SCREENS ============ */
  .screen{animation:fadeUp .4s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* HERO */
  .hero{text-align:center;padding:34px 22px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01));border:1px solid var(--border);box-shadow:var(--shadow);position:relative;overflow:hidden}
  .hero::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--hud),var(--accent2),transparent);opacity:.6}
  .hero .badge{display:inline-block;font-size:11px;letter-spacing:2px;font-weight:800;padding:6px 16px;border-radius:999px;background:rgba(99,230,255,.1);color:var(--accent);border:1px solid rgba(99,230,255,.4);margin-bottom:16px;text-shadow:0 0 8px rgba(99,230,255,.5);box-shadow:0 0 20px rgba(99,230,255,.2)}
  .hero h1{margin:0 0 10px;font-size:clamp(24px,4.5vw,38px);letter-spacing:-.5px}
  .hero h1 .grad{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(99,230,255,.5))}
  .hero p{color:var(--muted);max-width:560px;margin:0 auto 22px;font-size:14px}
  .field{display:flex;gap:10px;max-width:420px;margin:0 auto 18px;flex-wrap:wrap}
  .field input{flex:1;min-width:180px;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid var(--border);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:all .2s ease}
  .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,230,255,.18),0 0 20px rgba(99,230,255,.3)}
  .profile-chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
  .profile-chip{font-size:11px;padding:6px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-family:inherit;transition:all .2s}
  .profile-chip:hover{background:rgba(99,230,255,.1);color:var(--accent);border-color:var(--accent);box-shadow:0 0 12px rgba(99,230,255,.3)}
  .cp-list{list-style:none;padding:0;margin:22px auto 0;max-width:560px;text-align:left;display:grid;gap:8px}
  .cp-list li{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);padding:10px 12px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
  .cp-list li::before{content:"▸";color:var(--accent);font-weight:900}

  /* MAP */
  .section-title{font-size:12px;letter-spacing:2.5px;color:var(--muted);font-weight:800;margin:6px 0 14px;text-transform:uppercase}
  .map{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .level{position:relative;text-align:left;padding:18px;border-radius:16px;cursor:pointer;background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--border);color:var(--text);font-family:inherit;transition:all .2s ease;overflow:hidden}
  .level::before{content:'';position:absolute;inset:0;border-radius:16px;padding:1px;background:linear-gradient(135deg,transparent 40%,var(--accent),transparent 60%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s;animation:borderSpin 4s linear infinite;background-size:200% 200%}
  @keyframes borderSpin{0%{background-position:0% 50%}100%{background-position:200% 50%}}
  .level:hover:not([disabled])::before{opacity:1}
  .level:hover:not([disabled]){transform:translateY(-3px);background:rgba(255,255,255,.06);box-shadow:0 12px 32px rgba(0,0,0,.5),0 0 24px rgba(99,230,255,.15)}
  .level:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .level[disabled]{opacity:.45;cursor:not-allowed}
  .level .row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .level .icon{font-size:26px;filter:drop-shadow(0 0 8px rgba(99,230,255,.5))}
  .level .tag{font-size:10px;font-weight:800;letter-spacing:1px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted)}
  .level[data-done="1"] .tag{background:rgba(52,211,153,.15);color:var(--good);box-shadow:0 0 12px rgba(52,211,153,.3)}
  .level h3{margin:0 0 4px;font-size:16px;letter-spacing:.2px}
  .level p{margin:0;font-size:12px;color:var(--muted)}
  .level .bar{height:5px;border-radius:999px;background:rgba(255,255,255,.08);margin-top:12px;overflow:hidden}
  .level .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .4s ease;box-shadow:0 0 8px var(--hud)}

  /* QUESTION */
  .quiz-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .crumbs{font-size:12px;color:var(--muted);letter-spacing:.5px;font-weight:600}
  .crumbs b{color:var(--text)}
  .combo{font-size:12px;font-weight:800;padding:5px 14px;border-radius:999px;background:rgba(251,191,36,.15);color:var(--warn);border:1px solid rgba(251,191,36,.4);opacity:0;transition:opacity .3s ease;text-shadow:0 0 8px rgba(251,191,36,.5)}
  .combo.on{opacity:1}
  .combo.pulse{animation:comboPulse .6s cubic-bezier(.34,1.56,.64,1)}
  @keyframes comboPulse{0%{transform:scale(1)}40%{transform:scale(1.4);box-shadow:0 0 24px rgba(251,191,36,.8)}100%{transform:scale(1)}}

  .qcard{position:relative;padding:26px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden}
  .qcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--hud),var(--accent2),transparent);opacity:.8;background-size:200% 100%;animation:topFlow 3s linear infinite}
  @keyframes topFlow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
  .qcard::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent2),transparent);opacity:.5}
  .qcard.shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
  .qcard.correct-flash{animation:correctFlash .7s ease}
  @keyframes correctFlash{0%{box-shadow:var(--shadow)}30%{box-shadow:0 0 60px rgba(52,211,153,.8),var(--shadow)}100%{box-shadow:var(--shadow)}}

  .bloom{display:inline-block;font-size:10px;font-weight:900;letter-spacing:1.2px;padding:4px 10px;border-radius:6px;margin-bottom:12px;background:rgba(167,139,250,.15);color:var(--accent2);border:1px solid rgba(167,139,250,.4);text-shadow:0 0 8px rgba(167,139,250,.5)}
  .bloom.stim{background:rgba(52,211,153,.15);color:var(--good);border-color:rgba(52,211,153,.4);text-shadow:0 0 8px rgba(52,211,153,.5)}
  .qtext{font-size:16px;line-height:1.55;margin:0 0 20px;font-weight:600}
  .stimulus{margin:0 0 18px;padding:14px 16px;background:rgba(99,230,255,.05);border-left:3px solid var(--accent);border-radius:8px;font-size:13.5px;color:#c9d2f0;line-height:1.65;font-style:italic;box-shadow:inset 0 0 20px rgba(99,230,255,.05)}
  .stimulus b{color:var(--accent);font-style:normal;text-shadow:0 0 8px rgba(99,230,255,.5)}
  .options{display:grid;gap:10px}
  .opt{position:relative;display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text);font-size:14px;font-family:inherit;line-height:1.45;transition:all .15s ease;overflow:hidden}
  .opt::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background .2s}
  .opt:hover:not([disabled]){background:var(--panel2);border-color:rgba(99,230,255,.4);transform:translateX(3px)}
  .opt:hover:not([disabled])::before{background:var(--accent);box-shadow:0 0 12px var(--hud)}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .opt .key{flex:0 0 26px;height:26px;border-radius:8px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--muted);transition:all .2s}
  .opt[data-state="sel"]{border-color:var(--accent);background:rgba(99,230,255,.08);box-shadow:0 0 20px rgba(99,230,255,.2)}
  .opt[data-state="sel"]::before{background:var(--accent)}
  .opt[data-state="sel"] .key{background:var(--accent);color:#04122b;box-shadow:0 0 12px var(--hud)}
  .opt[data-state="correct"]{border-color:var(--good);background:rgba(52,211,153,.12);animation:pop .35s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 20px rgba(52,211,153,.4)}
  .opt[data-state="correct"]::before{background:var(--good)}
  .opt[data-state="correct"] .key{background:var(--good);color:#04122b;box-shadow:0 0 12px var(--good)}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
  .opt[data-state="wrong"]{border-color:var(--bad);background:rgba(248,113,113,.1);box-shadow:0 0 20px rgba(248,113,113,.3)}
  .opt[data-state="wrong"]::before{background:var(--bad)}
  .opt[data-state="wrong"] .key{background:var(--bad);color:#2b0404;box-shadow:0 0 12px var(--bad)}
  .opt[disabled]{cursor:default}

  .unk-btn{width:100%;margin-top:10px;padding:12px 16px;border-radius:12px;border:1px dashed rgba(250,204,21,.5);background:rgba(250,204,21,.05);color:var(--warn);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:all .2s}
  .unk-btn:hover:not([disabled]){background:rgba(250,204,21,.12);border-style:solid;box-shadow:0 0 16px rgba(250,204,21,.3)}
  .unk-btn[disabled]{cursor:default;opacity:.5}

  .fb{margin-top:16px;padding:16px 18px;border-radius:14px;border:1px solid var(--border);background:var(--panel);animation:fadeUp .3s ease both;position:relative;overflow:hidden}
  .fb::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
  .fb.good{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.07)}
  .fb.good::before{background:var(--good);box-shadow:0 0 12px var(--good)}
  .fb.bad{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.07)}
  .fb.bad::before{background:var(--bad);box-shadow:0 0 12px var(--bad)}
  .fb.unk{border-color:rgba(250,204,21,.5);background:rgba(250,204,21,.06)}
  .fb.unk::before{background:var(--unk);box-shadow:0 0 12px var(--unk)}
  .fb h4{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fb.good h4{color:var(--good)}
  .fb.bad h4{color:var(--bad)}
  .fb.unk h4{color:var(--warn)}
  .fb p{margin:0;font-size:13.5px;color:#c9d2f0;line-height:1.6}
  .fb .hint{margin-top:10px;font-size:13px;color:var(--warn)}

  .quiz-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
  .kbd-hint{font-size:11px;color:var(--muted)}
  .kbd{display:inline-block;padding:1px 6px;margin:0 1px;background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}

  /* Professor */
  .professor{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,rgba(99,230,255,.08),rgba(167,139,250,.05));border:1px solid rgba(99,230,255,.3);animation:fadeUp .5s ease both;box-shadow:0 0 32px rgba(99,230,255,.15);position:relative;overflow:hidden}
  .professor::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 0% 50%,rgba(99,230,255,.1),transparent 70%);pointer-events:none}
  .professor .pic{font-size:36px;line-height:1;flex-shrink:0;filter:drop-shadow(0 0 12px rgba(99,230,255,.7));animation:picBob 3s ease-in-out infinite}
  @keyframes picBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  .professor .name{font-weight:800;font-size:12px;color:var(--accent);letter-spacing:1px;margin-bottom:3px;text-shadow:0 0 8px rgba(99,230,255,.5)}

  /* RESULT */
  .result{padding:28px;border-radius:20px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01));border:1px solid var(--border);box-shadow:var(--shadow);position:relative;overflow:hidden}
  .result::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--hud),var(--accent2),transparent);opacity:.7}
  .result .trophy{font-size:56px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 0 24px rgba(251,191,36,.6));animation:trophyBob 3s ease-in-out infinite}
  @keyframes trophyBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .result h2{margin:0 0 6px;font-size:22px}
  .result .rank{color:var(--accent);font-weight:800;letter-spacing:1.5px;font-size:13px;margin-bottom:20px;text-shadow:0 0 12px rgba(99,230,255,.5)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:20px 0}
  .stat{padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--border);position:relative;overflow:hidden}
  .stat::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.6}
  .stat b{display:block;font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(99,230,255,.4)}
  .stat span{font-size:11px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
  .result .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .achievements{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin-top:16px;text-align:left}
  .ach{padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(167,139,250,.08));border:1px solid rgba(251,191,36,.35);display:flex;gap:10px;align-items:center;font-size:12px;box-shadow:0 0 16px rgba(251,191,36,.15)}
  .ach .i{font-size:22px;flex-shrink:0;filter:drop-shadow(0 0 8px rgba(251,191,36,.6))}
  .ach .t{font-weight:800;color:var(--warn);font-size:12px}
  .ach .d{color:var(--muted);font-size:11px;line-height:1.3}

  /* Toast */
  .toast{position:fixed;top:16px;right:16px;z-index:80;display:flex;gap:12px;align-items:center;padding:14px 18px;border-radius:14px;background:linear-gradient(135deg,rgba(30,40,80,.95),rgba(40,25,70,.95));border:1px solid rgba(251,191,36,.5);box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 40px rgba(251,191,36,.35);transform:translateX(120%);transition:transform .4s cubic-bezier(.34,1.56,.64,1);max-width:320px;pointer-events:none;backdrop-filter:blur(8px)}
  .toast.show{transform:translateX(0)}
  .toast-icon{font-size:32px;filter:drop-shadow(0 0 12px rgba(251,191,36,.7))}
  .toast-title{font-weight:900;font-size:13px;color:var(--warn);letter-spacing:.3px;text-shadow:0 0 8px rgba(251,191,36,.5)}
  .toast-desc{font-size:12px;color:#c9d2f0;margin-top:2px}

  /* Rocket */
  #rocket{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:radial-gradient(circle at 50% 100%,rgba(99,230,255,.15),transparent 60%),linear-gradient(180deg,#000308 0%,#050920 100%);opacity:0;pointer-events:none;transition:opacity .35s ease;overflow:hidden}
  #rocket.active{opacity:1;pointer-events:auto}
  .speedlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0px,transparent 40px,rgba(180,220,255,.15) 40px,rgba(180,220,255,.15) 42px,transparent 42px,transparent 90px);animation:streak .8s linear infinite}
  @keyframes streak{from{transform:translateY(0)}to{transform:translateY(90px)}}
  .rocket-icon{font-size:72px;z-index:2;transform:translateY(-40vh) rotate(-45deg);filter:drop-shadow(0 0 24px rgba(99,230,255,.9));animation:launch 2.4s cubic-bezier(.5,0,.9,1) forwards}
  @keyframes launch{0%{transform:translateY(60vh) rotate(-45deg) scale(.7)}100%{transform:translateY(-60vh) rotate(-45deg) scale(1.1)}}
  .rocket-level{position:absolute;bottom:22%;font-size:14px;letter-spacing:3px;font-weight:900;color:var(--accent);text-shadow:0 0 20px var(--hud);opacity:0;animation:levelFlash 2.4s ease forwards}
  @keyframes levelFlash{0%,30%{opacity:0;transform:translateY(10px)}50%,80%{opacity:1;transform:translateY(0)}100%{opacity:0}}

  /* Drawer */
  .drawer{position:fixed;inset:auto 0 0 0;z-index:20;background:linear-gradient(180deg,#0d1330,#0a0f24);border-top:1px solid var(--border);transform:translateY(100%);transition:transform .3s ease;max-height:70vh;overflow:auto;box-shadow:0 -12px 40px rgba(0,0,0,.7)}
  .drawer.open{transform:translateY(0)}
  .drawer-inner{max-width:1000px;margin:0 auto;padding:20px 18px 40px}
  .drawer h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
  .glossary{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .glossary div{padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--border);font-size:12.5px;transition:all .2s}
  .glossary div:hover{border-color:rgba(99,230,255,.4);background:rgba(99,230,255,.05)}
  .glossary b{color:var(--accent);display:block;margin-bottom:3px;font-size:12.5px}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .noscript{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#0b1026;color:#e6ecff;font-size:15px;padding:24px;text-align:center}
  footer{margin-top:26px;text-align:center;font-size:11px;color:var(--muted);letter-spacing:.4px}

  @media (max-width:520px){
    .hud-sub{display:none}
    .xpbar{width:80px}
    .hero{padding:24px 16px}
    .qcard{padding:18px}
    .qtext{font-size:15px}
    .toast{top:auto;bottom:16px;right:16px;left:16px;max-width:none}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
    .speedlines,.scanlines,.hud-frame::after{display:none}
    .planet{animation:none}
  }
  @media print{
    body{background:#fff;color:#111}
    #sky,#starfield,#particles,#fx,.scanlines,.hud-frame,.altimeter,.visualizer,.boot,.hud,.iconbtn,.actions,footer,.kbd-hint,.combo,#rocket,.toast,.professor{display:none !important}
    .wrap{max-width:100%;padding:0}
    .result{border:2px solid #111;box-shadow:none;background:#fff;color:#111}
    .result .rank{color:#444}
    .stat,.ach{background:#f4f4f4;border-color:#ddd}
    .stat b{color:#111}
  }
</style>
</head>

  /* ================= AUDIO ================= */
  let audioCtx = null;
  function ensureAudio(){
    if(audioCtx) return audioCtx;
    try{ const AC = window.AudioContext || window.webkitAudioContext; if(AC) audioCtx = new AC(); }catch(e){ audioCtx = null; }
    return audioCtx;
  }
  function beep(freq, dur, type, vol){
    if(!State || !State.soundOn) return;
    const ctx = ensureAudio(); if(!ctx) return;
    if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
    dur = dur || 0.1; type = type || 'sine'; vol = (vol == null) ? 0.07 : vol;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur);
  }
  const sfx = {
    click:() => beep(420, 0.06, 'triangle', 0.05),
    select:() => beep(620, 0.07, 'sine', 0.05),

  let ambient = null;
  function startAmbient(levelId){
    if(!State || !State.soundOn) return;
    const cfg = AMBIENT[levelId]; if(!cfg) return;
    const ctx = ensureAudio(); if(!ctx) return;
    if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
    stopAmbient();
    try{
      const osc = ctx.createOscillator(), gain = ctx.createGain(), lfo = ctx.createOscillator(), lfoGain = ctx.createGain();
      osc.frequency.value = cfg.freq; osc.type = cfg.type;
      lfo.frequency.value = cfg.lfo; lfoGain.gain.value = cfg.depth;
      lfo.connect(lfoGain); lfoGain.connect(gain.gain);
      osc.connect(gain); gain.connect(ctx.destination);
      gain.gain.value = 0; osc.start(); lfo.start();
      gain.gain.linearRampToValueAtTime(cfg.vol, ctx.currentTime + 1.2);
      ambient = { osc, lfo, gain, ctx };
      $('#visualizer').classList.add('show');
      $('#visualizer').classList.remove('paused');
    }catch(e){ ambient = null; }
  }
  function stopAmbient(){
    if(!ambient){ $('#visualizer').classList.remove('show'); return; }
    const a = ambient; ambient = null;
    try{
      a.gain.gain.cancelScheduledValues(a.ctx.currentTime);
      a.gain.gain.linearRampToValueAtTime(0, a.ctx.currentTime + 0.5);
      setTimeout(()=>{ try{ a.osc.stop(); a.lfo.stop(); }catch(e){} }, 600);
    }catch(e){}
    $('#visualizer').classList.remove('show');
  }

  function announce(msg){ live.textContent = ''; setTimeout(()=>{ live.textContent = msg; }, 30); }

  function el(tag, attrs, children){
    const n = document.createElement(tag);
    if(attrs){
      for(const k in attrs){
        const v = attrs[k];
        if(v === null || v === undefined) continue;
        if(k === 'class')      n.className = v;
        else if(k === 'text')  n.textContent = v;
        else if(k === 'html')  n.innerHTML = v;
        else if(k.slice(0,2) === 'on') n.addEventListener(k.slice(2).toLowerCase(), v);
        else n.setAttribute(k, v);
      }
    }
    (children||[]).forEach(c => n.appendChild(c));
    return n;
  }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function totalQuestions(){ return Object.keys(BANK).reduce((s,k)=> s + BANK[k].length, 0); }
  function xpToRank(xp){
    if(xp >= 1200) return { name:'Ahli Atmosfer', icon:'🧙' };
    if(xp >= 800)  return { name:'Peneliti Atmosfer', icon:'🔬' };
    if(xp >= 400)  return { name:'Detektif Cuaca', icon:'🕵️' };
    if(xp >= 150)  return { name:'Pengamat Langit', icon:'🔭' };
    return { name:'Pemula', icon:'🥚' };
  }
  function pickSession(levelId){
    const pool = shuffle(BANK[levelId]);
    return pool.slice(0, QUESTIONS_PER_SESSION).map(q => {
      const idx = q.options.map((_,i)=>i);
      const sh = shuffle(idx);
      const newOptions = sh.map(i => q.options[i]);
      const newAnswer = sh.indexOf(q.answer);
      const newMis = {};
      if(q.misconception){
        for(const k in q.misconception){
          const ni = sh.indexOf(parseInt(k,10));
          if(ni >= 0) newMis[ni] = q.misconception[k];
        }
      }
      return { id:q.id, bloom:q.bloom, q:q.q, stim:q.stim || null, options:newOptions, answer:newAnswer, explain:q.explain, misconception:newMis };
    });
  }

  /* ================= STARFIELD ================= */
  (function initStarfield(){
    const canvas = $('#starfield'); if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let w=0,h=0,dpr=1, stars=[], shooting=[], raf=null, lastTime=0;
    function resize(){
      dpr = Math.min(window.devicePixelRatio||1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = Math.floor(w*dpr); canvas.height = Math.floor(h*dpr);
      canvas.style.width = w+'px'; canvas.style.height = h+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0); build();
    }
    function build(){
      const count = Math.min(Math.floor((w*h)/9000), 140);
      stars = [];
      for(let i=0;i<count;i++) stars.push({ x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.3+0.2, a:Math.random()*.6+.2, tw:Math.random()*Math.PI*2, sp:Math.random()*.02+.005 });
    }
    function spawnShooting(){
      if(reduce) return;
      if(Math.random() > 0.995) shooting.push({ x:Math.random()*w*.8, y:Math.random()*h*.4, vx:3+Math.random()*3, vy:1+Math.random()*2, life:1 });
    }
    function draw(t){
      if(!lastTime) lastTime = t;
      const dt = Math.min((t-lastTime)/16.67, 3); lastTime = t;
      ctx.clearRect(0,0,w,h);
      for(let i=0;i<stars.length;i++){
        const s = stars[i]; s.tw += s.sp*dt;
        const alpha = s.a + Math.sin(s.tw)*0.15;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(180,205,255,'+Math.max(0,Math.min(1,alpha))+')'; ctx.fill();
      }
      spawnShooting();
      for(let i=shooting.length-1;i>=0;i--){
        const sh = shooting[i];
        sh.x += sh.vx*dt; sh.y += sh.vy*dt; sh.life -= 0.012*dt;
        if(sh.life<=0 || sh.x>w+50 || sh.y>h+50){ shooting.splice(i,1); continue; }
        const grd = ctx.createLinearGradient(sh.x, sh.y, sh.x-sh.vx*8, sh.y-sh.vy*8);
        grd.addColorStop(0, 'rgba(160,220,255,'+sh.life+')');
        grd.addColorStop(1, 'rgba(160,220,255,0)');
        ctx.strokeStyle = grd; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(sh.x-sh.vx*8, sh.y-sh.vy*8); ctx.stroke();
      }
      if(reduce) return;
      raf = requestAnimationFrame(draw);
    }
    resize();
    window.addEventListener('resize', () => { cancelAnimationFrame(raf); resize(); if(!reduce) raf = requestAnimationFrame(draw); else draw(performance.now()); });
    if(reduce) draw(performance.now()); else raf = requestAnimationFrame(draw);
    document.addEventListener('visibilitychange', () => {
      if(reduce) return;
      if(document.hidden) cancelAnimationFrame(raf);
      else { lastTime = 0; raf = requestAnimationFrame(draw); }
    });
  })();

  /* ================= PARTICLES PER LAYER ================= */
  (function initParticles(){
    const canvas = $('#particles'); if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let w=0,h=0,dpr=1, raf=null, lastTime=0;
    let currentLevel = null;
    let particles = [];
    let auroraPhase = 0;

    function resize(){
      dpr = Math.min(window.devicePixelRatio||1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = Math.floor(w*dpr); canvas.height = Math.floor(h*dpr);
      canvas.style.width = w+'px'; canvas.style.height = h+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      rebuild();
    }

    function rebuild(){
      particles = [];
      if(!currentLevel) return;
      if(currentLevel === 'troposfer'){
        // awan + butiran hujan
        for(let i=0;i<14;i++){
          particles.push({ type:'cloud', x:Math.random()*w, y:Math.random()*h*0.7, r:60+Math.random()*90, vx:0.15+Math.random()*0.25, alpha:0.06+Math.random()*0.06 });
        }
        for(let i=0;i<40;i++){
          particles.push({ type:'drop', x:Math.random()*w, y:Math.random()*h, vy:1+Math.random()*2, alpha:0.15+Math.random()*0.25, len:4+Math.random()*8 });
        }
      } else if(currentLevel === 'stratosfer'){
        // partikel ozon biru + sinar UV
        for(let i=0;i<60;i++){
          particles.push({ type:'ozone', x:Math.random()*w, y:Math.random()*h, r:1+Math.random()*2, vy:-0.15-Math.random()*0.3, alpha:0.3+Math.random()*0.4, tw:Math.random()*Math.PI*2, hue:180+Math.random()*40 });
        }
        for(let i=0;i<8;i++){
          particles.push({ type:'uv', x:Math.random()*w, y:-50-Math.random()*200, vx:0.3+Math.random()*0.5, vy:0.8+Math.random()*0.6, alpha:0.08, len:60+Math.random()*80 });
        }
      } else if(currentLevel === 'mesosfer'){
        // meteor jatuh + debu
        for(let i=0;i<30;i++){
          particles.push({ type:'dust', x:Math.random()*w, y:Math.random()*h, r:0.5+Math.random()*0.8, alpha:0.2+Math.random()*0.3, tw:Math.random()*Math.PI*2 });
        }
        for(let i=0;i<5;i++){
          particles.push({ type:'meteor', x:Math.random()*w, y:-100-Math.random()*300, vx:2+Math.random()*3, vy:4+Math.random()*4, alpha:0.9, life:1, delay:Math.random()*5 });
        }
      } else if(currentLevel === 'termosfer'){
        // aurora bergerak
        for(let i=0;i<3;i++){
          particles.push({ type:'aurora', offset:Math.random()*Math.PI*2, hue:120+i*50, y:h*0.2+i*h*0.15, alpha:0.15 });
        }
        for(let i=0;i<80;i++){
          particles.push({ type:'star', x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.2, tw:Math.random()*Math.PI*2, sp:Math.random()*0.03+0.01, alpha:0.3+Math.random()*0.5 });
        }
      } else if(currentLevel === 'eksosfer'){
        // satelit mengorbit + bintang terang
        for(let i=0;i<100;i++){
          particles.push({ type:'star', x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.5, tw:Math.random()*Math.PI*2, sp:Math.random()*0.02+0.005, alpha:0.4+Math.random()*0.6 });
        }
        for(let i=0;i<2;i++){
          particles.push({ type:'satellite', angle:Math.random()*Math.PI*2, speed:0.002+Math.random()*0.002, radius:Math.min(w,h)*0.35, cx:w*0.5, cy:h*0.6 });
        }
      }
    }

    function draw(t){
      if(!lastTime) lastTime = t;
      const dt = Math.min((t-lastTime)/16.67, 3); lastTime = t;
      ctx.clearRect(0,0,w,h);

      // Troposfer — awan + hujan
      if(currentLevel === 'troposfer'){
        particles.forEach(p => {
          if(p.type === 'cloud'){
            const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
            grd.addColorStop(0, 'rgba(220,235,255,'+p.alpha+')');
            grd.addColorStop(1, 'rgba(220,235,255,0)');
            ctx.fillStyle = grd;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            p.x += p.vx * dt;
            if(p.x > w + p.r) { p.x = -p.r; p.y = Math.random()*h*0.7; }
          } else if(p.type === 'drop'){
            ctx.strokeStyle = 'rgba(180,220,255,'+p.alpha+')';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y+p.len); ctx.stroke();
            p.y += p.vy * dt;
            if(p.y > h) { p.y = -10; p.x = Math.random()*w; }
          }
        });
      }
      // Stratosfer — ozon + UV
      else if(currentLevel === 'stratosfer'){
        particles.forEach(p => {
          if(p.type === 'ozone'){
            p.tw += 0.05 * dt;
            const a = p.alpha * (0.6 + Math.sin(p.tw)*0.4);
            ctx.fillStyle = 'hsla('+p.hue+',100%,70%,'+a+')';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            p.y += p.vy * dt;
            if(p.y < -5) { p.y = h+5; p.x = Math.random()*w; }
          } else if(p.type === 'uv'){
            const grd = ctx.createLinearGradient(p.x, p.y, p.x+p.len, p.y+p.len*1.5);
            grd.addColorStop(0, 'rgba(255,220,140,0)');
            grd.addColorStop(0.5, 'rgba(255,220,140,'+p.alpha+')');
            grd.addColorStop(1, 'rgba(255,220,140,0)');
            ctx.strokeStyle = grd; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x+p.len, p.y+p.len*1.5); ctx.stroke();
            p.x += p.vx * dt; p.y += p.vy * dt;
            if(p.x > w+100 || p.y > h+100) { p.x = -100; p.y = -50-Math.random()*200; }
          }
        });
      }
      // Mesosfer — meteor + debu
      else if(currentLevel === 'mesosfer'){
        particles.forEach(p => {
          if(p.type === 'dust'){
            p.tw += 0.02 * dt;
            const a = p.alpha * (0.5 + Math.sin(p.tw)*0.5);
            ctx.fillStyle = 'rgba(200,210,240,'+a+')';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
          } else if(p.type === 'meteor'){
            if(p.delay > 0){ p.delay -= 0.016 * dt; return; }
            const grd = ctx.createLinearGradient(p.x, p.y, p.x-p.vx*10, p.y-p.vy*10);
            grd.addColorStop(0, 'rgba(255,240,180,'+p.alpha+')');
            grd.addColorStop(0.4, 'rgba(255,180,90,'+p.alpha*0.6+')');
            grd.addColorStop(1, 'rgba(255,120,40,0)');
            ctx.strokeStyle = grd; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x-p.vx*10, p.y-p.vy*10); ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,220,'+p.alpha+')';
            ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
            p.x += p.vx * dt; p.y += p.vy * dt;
            if(p.x > w+100 || p.y > h+100){ p.x = -100-Math.random()*200; p.y = -100-Math.random()*200; p.delay = Math.random()*5; }
          }
        });
      }
      // Termosfer — aurora + bintang
      else if(currentLevel === 'termosfer'){
        auroraPhase += 0.008 * dt;
        particles.forEach(p => {
          if(p.type === 'aurora'){
            const amp = 40 + Math.sin(auroraPhase + p.offset) * 20;
            const grd = ctx.createLinearGradient(0, p.y-amp, 0, p.y+amp);
            grd.addColorStop(0, 'hsla('+p.hue+',90%,60%,0)');
            grd.addColorStop(0.5, 'hsla('+p.hue+',90%,60%,'+p.alpha+')');
            grd.addColorStop(1, 'hsla('+p.hue+',90%,60%,0)');
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.moveTo(0, p.y);
            for(let x=0; x<=w; x+=20){
              const y = p.y + Math.sin(auroraPhase*2 + x*0.008 + p.offset) * amp;
              ctx.lineTo(x, y);
            }
            ctx.lineTo(w, p.y + amp*2);
            ctx.lineTo(0, p.y + amp*2);
            ctx.closePath();
            ctx.fill();
          } else if(p.type === 'star'){
            p.tw += p.sp * dt;
            const a = p.alpha * (0.5 + Math.sin(p.tw)*0.5);
            ctx.fillStyle = 'rgba(220,240,255,'+a+')';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
          }
        });
      }
      // Eksosfer — bintang terang + satelit orbit
      else if(currentLevel === 'eksosfer'){
        particles.forEach(p => {
          if(p.type === 'star'){
            p.tw += p.sp * dt;
            const a = p.alpha * (0.5 + Math.sin(p.tw)*0.5);
            const r = p.r + Math.sin(p.tw)*0.3;
            ctx.fillStyle = 'rgba(255,255,255,'+a+')';
            ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2); ctx.fill();
            if(p.r > 1){
              ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(180,220,255,.8)';
              ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2); ctx.fill();
              ctx.shadowBlur = 0;
            }
          } else if(p.type === 'satellite'){
            p.angle += p.speed * dt;
            const x = p.cx + Math.cos(p.angle) * p.radius;
            const y = p.cy + Math.sin(p.angle) * p.radius * 0.4;
            ctx.fillStyle = 'rgba(255,255,255,.9)';
            ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'rgba(99,230,255,.3)'; ctx.lineWidth = 0.5;
            ctx.beginPath(); ctx.ellipse(p.cx, p.cy, p.radius, p.radius*0.4, 0, 0, Math.PI*2); ctx.stroke();
          }
        });
      }

      if(reduce) return;
      raf = requestAnimationFrame(draw);
    }

    resize();
    window.addEventListener('resize', () => { cancelAnimationFrame(raf); resize(); if(!reduce) raf = requestAnimationFrame(draw); else draw(performance.now()); });
    if(reduce) draw(performance.now()); else raf = requestAnimationFrame(draw);

    // expose setter
    window.__setParticleLevel = function(levelId){
      currentLevel = levelId;
      rebuild();

    document.addEventListener('visibilitychange', () => {
      if(reduce) return;
      if(document.hidden) cancelAnimationFrame(raf);
      else { lastTime = 0; raf = requestAnimationFrame(draw); }
    });
  })();

  const fxCanvas = $('#fx'); const fxCtx = fxCanvas.getContext('2d');
  let fxParticles = [], fxRunning = false, fxDpr = 1;
  function fxResize(){
    fxDpr = Math.min(window.devicePixelRatio||1, 2);
    fxCanvas.width = Math.floor(window.innerWidth*fxDpr); fxCanvas.height = Math.floor(window.innerHeight*fxDpr);
    fxCanvas.style.width = window.innerWidth+'px'; fxCanvas.style.height = window.innerHeight+'px';
    fxCtx.setTransform(fxDpr,0,0,fxDpr,0,0);
  }
  fxResize(); window.addEventListener('resize', fxResize);
  function burst(x, y, colors){
    const palette = colors || ['#63e6ff','#a78bfa','#34d399','#fbbf24','#f87171','#ffffff'];
    for(let i=0;i<32;i++){
      fxParticles.push({ x, y, vx:(Math.random()-.5)*14, vy:-Math.random()*9-2, g:0.35, life:1, color:palette[Math.floor(Math.random()*palette.length)], size:Math.random()*5+3, rot:Math.random()*Math.PI*2, vr:(Math.random()-.5)*.35 });
    }
    if(!fxRunning) fxLoop();
  }
  function fxLoop(){
    fxRunning = true;
    const W = window.innerWidth, H = window.innerHeight;
    fxCtx.clearRect(0,0,W,H);
    for(let i=fxParticles.length-1;i>=0;i--){
      const p = fxParticles[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.995; p.rot += p.vr; p.life -= 0.014;
      if(p.life <= 0 || p.y > H + 30){ fxParticles.splice(i,1); continue; }
      fxCtx.save(); fxCtx.translate(p.x, p.y); fxCtx.rotate(p.rot);
      fxCtx.globalAlpha = Math.max(0, p.life); fxCtx.fillStyle = p.color;
      fxCtx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6); fxCtx.restore();
    }
    if(fxParticles.length > 0) requestAnimationFrame(fxLoop);
    else { fxRunning = false; fxCtx.clearRect(0,0,W,H); }
  }

  /* ================= ALTIMETER ================= */
  function updateAltimeter(levelId){
    const al = $('#altimeter');
    if(!levelId){ al.classList.remove('show'); return; }
    al.classList.add('show');
    const lv = LEVELS.find(l => l.id === levelId);
    if(!lv) return;
    // konversi altMid (km) → posisi vertikal (0% = atas/500+ km, 100% = bawah/0 km)
    // Pakai skala logaritmik agar merata
    const alt = lv.altMid;
    const logAlt = Math.log10(alt + 1);       // 0 → 0.78 (Troposfer) hingga 600 → 2.78 (Eksosfer)
    const maxLog = Math.log10(650);
    const pct = Math.max(3, Math.min(97, 100 - (logAlt / maxLog) * 100));
    $('#altMarker').style.top = pct + '%';
    $('#altRocket').style.top = pct + '%';
    $('#altLabel').textContent = alt + ' km';
  }

  function renderQuestion(){

    const wrap = el('section', { class:'screen' });

  function selectOption(i){
    if(State.screen !== 'question') return;
    const opts = $$('.opt');
    opts.forEach((o, idx) => {
      if(idx === i){ o.setAttribute('data-state','sel'); o.setAttribute('aria-checked','true'); }
      else { o.removeAttribute('data-state'); o.setAttribute('aria-checked','false'); }
    });
    selectedOption = i;
    const btn = $('#submitBtn'); if(btn) btn.disabled = false;
    sfx.select();
  }

  function submitAnswer(){
    if(selectedOption == null) return;
    const lv = LEVELS[State.currentLevel];
    const q = State.sessionQuestions[State.currentQ];
    const isCorrect = selectedOption === q.answer;

    const opts = $$('.opt');
    let correctEl = null;
    opts.forEach((o, idx) => {
      o.setAttribute('disabled','true');
      if(idx === q.answer){ o.setAttribute('data-state','correct'); correctEl = o; }
      else if(idx === selectedOption) o.setAttribute('data-state','wrong');
    });

    let gained = 0;
    if(isCorrect){
      State.combo += 1; State.totalCorrect += 1;
      if(State.combo > State.bestCombo) State.bestCombo = State.combo;
      gained = XP_PER_CORRECT;
      if(State.combo >= 2) gained += XP_COMBO_BONUS * Math.min(State.combo - 1, 3);
      State.xp += gained;
      sfx.good();
      if(correctEl){ const r = correctEl.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2); }
      const qcard = $('#qcard'); if(qcard){ qcard.classList.remove('correct-flash'); void qcard.offsetWidth; qcard.classList.add('correct-flash'); }
      const badge = $('#comboBadge');
      if(badge && State.combo >= 2){ badge.textContent = '🔥 Combo ×' + State.combo; badge.classList.add('on'); badge.classList.remove('pulse'); void badge.offsetWidth; badge.classList.add('pulse'); }
      if(q.id === 'stra-05') State.masteredOzone = true;
    } else {
      State.combo = 0; sfx.bad();
      const qcard = $('#qcard'); if(qcard){ qcard.classList.remove('shake'); void qcard.offsetWidth; qcard.classList.add('shake'); }
    }
    State.sessionAnswers.push({ idx:selectedOption, correct:isCorrect, gained, unknown:false });

    if(!State.results[lv.id]) State.results[lv.id] = { correct:0, total:State.sessionQuestions.length, xp:0 };
    if(isCorrect) State.results[lv.id].correct += 1;
    State.results[lv.id].xp += gained;

    const ub = $('#unknownBtn'); if(ub) ub.setAttribute('disabled','true');

    updateHUD(); save();
    renderFeedback(q, isCorrect ? 'good' : 'bad', gained);
    checkAchievements();

    const submitBtn = $('#submitBtn');
    if(submitBtn){
      submitBtn.textContent = (State.currentQ + 1 >= State.sessionQuestions.length) ? 'Selesaikan Level →' : 'Soal Berikutnya →';
      submitBtn.disabled = false;
      submitBtn.setAttribute('aria-label', submitBtn.textContent);
      submitBtn.onclick = nextQuestion;
      submitBtn.focus();
    }
    announce(isCorrect ? ('Benar! +' + gained + ' XP.') : 'Belum tepat. Baca pembahasannya.');
  }

  function submitUnknown(){
    const lv = LEVELS[State.currentLevel];
    const q = State.sessionQuestions[State.currentQ];
    if(!q) return;

    const opts = $$('.opt');
    opts.forEach((o, idx) => {
      o.setAttribute('disabled','true');
      if(idx === q.answer) o.setAttribute('data-state','correct');
    });

    State.combo = 0;
    State.unknownCount = (State.unknownCount || 0) + 1;
    State.sessionAnswers.push({ idx:-1, correct:false, gained:0, unknown:true });
    sfx.unknown();

    if(!State.results[lv.id]) State.results[lv.id] = { correct:0, total:State.sessionQuestions.length, xp:0 };

    const ub = $('#unknownBtn'); if(ub) ub.setAttribute('disabled','true');

    updateHUD(); save();
    renderFeedback(q, 'unk', 0);
    checkAchievements();

    const submitBtn = $('#submitBtn');
    if(submitBtn){
      submitBtn.textContent = (State.currentQ + 1 >= State.sessionQuestions.length) ? 'Selesaikan Level →' : 'Soal Berikutnya →';
      submitBtn.disabled = false;
      submitBtn.setAttribute('aria-label', submitBtn.textContent);
      submitBtn.onclick = nextQuestion;
      submitBtn.focus();
    }
    announce('Jawaban ditampilkan. Baca pembahasannya.');
  }

  function renderFeedback(q, kind, gained){
    const slot = $('#fbSlot'); if(!slot) return;
    const fb = el('div', { class:'fb ' + kind });
    const h4 = el('h4');
    if(kind === 'good'){
      h4.appendChild(document.createTextNode('✅ Benar!'));
      if(gained) h4.appendChild(el('span', { style:'color:var(--warn);font-weight:800;font-size:12px;margin-left:8px', text:'+' + gained + ' XP' }));
    } else if(kind === 'bad'){ h4.appendChild(document.createTextNode('❌ Belum Tepat')); }
    else { h4.appendChild(document.createTextNode('💭 Belum Tahu — Oke, Mari Belajar')); }
    fb.appendChild(h4);
    fb.appendChild(el('p', { text: q.explain }));
    if(kind === 'bad' && q.misconception && q.misconception[selectedOption]){
      fb.appendChild(el('p', { class:'hint', text:'💡 ' + q.misconception[selectedOption] }));
    }
    if(kind === 'good' && State.combo >= 3){ fb.appendChild(el('p', { class:'hint', text:'🔥 Combo ×' + State.combo + '! Pertahankan!' })); }
    slot.appendChild(fb);
    fb.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  function nextQuestion(){
    State.currentQ += 1;
    if(State.currentQ >= State.sessionQuestions.length){
      const lv = LEVELS[State.currentLevel];
      const res = State.results[lv.id];
      if(res.correct === res.total && res.total > 0){ State.xp += XP_PER_LEVEL_BONUS; }
      if(State.currentLevel + 1 >= State.unlocked && State.currentLevel + 1 < LEVELS.length){ State.unlocked = State.currentLevel + 2; }
      save(); updateHUD(); checkAchievements(); stopAmbient();
      setScreen('result');
      return;
    }
    sfx.click(); render();
    announce('Soal ' + (State.currentQ + 1) + ' dari ' + State.sessionQuestions.length + '.');
  }

  /* ----- RESULT ----- */
  function renderResult(){
    const lv = LEVELS[State.currentLevel];
    const res = State.results[lv.id] || { correct:0, total:State.sessionQuestions.length, xp:0 };
    const sessionAns = State.sessionAnswers || [];
    const sessionUnknown = sessionAns.filter(a => a.unknown).length;
    const sessionCorrect = sessionAns.filter(a => a.correct).length;
    const totalCorrect = Object.keys(State.results).reduce((s,k)=> s + State.results[k].correct, 0);
    const pct = Math.round((totalCorrect / totalQuestions()) * 100);
    const rank = xpToRank(State.xp);

    const wrap = el('section', { class:'screen' });
    const card = el('div', { class:'result' });
    card.appendChild(el('div', { class:'trophy', text: pct >= 80 ? '🏆' : (pct >= 60 ? '🎖️' : '📘') }));
    card.appendChild(el('h2', { text: 'Misi Selesai, ' + State.playerName + '!' }));
    card.appendChild(el('div', { class:'rank', text: rank.icon + ' Peringkat: ' + rank.name }));

    const stats = el('div', { class:'stats' });
    stats.appendChild(el('div', { class:'stat' }, [ el('b', { text:String(State.xp) }), el('span', { text:'Total XP' }) ]));
    stats.appendChild(el('div', { class:'stat' }, [ el('b', { text: sessionCorrect + '/' + State.sessionQuestions.length }), el('span', { text:'Benar Sesi Ini' }) ]));
    stats.appendChild(el('div', { class:'stat' }, [ el('b', { text: sessionUnknown + '' }), el('span', { text:'Belum Tahu' }) ]));
    stats.appendChild(el('div', { class:'stat' }, [ el('b', { text: pct + '%' }), el('span', { text:'Akurasi Bank' }) ]));
    card.appendChild(stats);

    const summaryText = pct >= 80
      ? '🎉 Luar biasa! Kamu sudah menguasai karakteristik 5 lapisan atmosfer.'
      : pct >= 60
      ? '👍 Bagus! Baca ulang pembahasan pada soal yang salah, lalu ulangi levelnya — soal akan diacak ulang.'
      : '💪 Jangan menyerah! Baca glosarium dulu, lalu ulangi dari Troposfer.';

    card.appendChild(el('div', { style:'text-align:left;font-size:13px;color:#c9d2f0;max-width:560px;margin:0 auto 18px;line-height:1.7' }, [
      el('p', { style:'margin:0 0 8px', text: summaryText })
    ]));

    if(sessionUnknown >= 2){
      card.appendChild(el('p', { style:'font-size:12px;color:var(--warn);margin-bottom:14px', text:'💭 Kamu pakai "Belum tahu" ' + sessionUnknown + '×. Soal itu akan muncul lagi di percobaan berikutnya dengan urutan berbeda.' }));
    }

    if(State.achievements.length > 0){
      card.appendChild(el('div', { class:'section-title', style:'margin-top:10px;text-align:center', text:'Lencana Terkumpul (' + State.achievements.length + '/' + ACHIEVEMENTS.length + ')' }));
      const box = el('div', { class:'achievements' });
      ACHIEVEMENTS.forEach(a => {
        if(!State.achievements.includes(a.id)) return;
        const c = el('div', { class:'ach' });
        c.appendChild(el('div', { class:'i', text: a.icon }));
        const b = el('div');
        b.appendChild(el('div', { class:'t', text: a.name }));
        b.appendChild(el('div', { class:'d', text: a.desc }));
        c.appendChild(b); box.appendChild(c);
      });
      card.appendChild(box);
    }

    const actions = el('div', { class:'actions' });
    if(State.currentLevel + 1 < LEVELS.length){
      actions.appendChild(el('button', { class:'btn btn-primary', type:'button', onclick:() => {
        const nextLevel = LEVELS[State.currentLevel + 1];
        rocketTransition(nextLevel.name, () => {
          State.currentLevel += 1; State.currentQ = 0;
          State.sessionQuestions = pickSession(nextLevel.id);
          State.sessionAnswers = []; State.combo = 0;
          setScreen('question'); startAmbient(nextLevel.id);
          announce('Memulai level ' + nextLevel.name + '.');
        });
      }}, [document.createTextNode('🚀 Lanjut: ' + LEVELS[State.currentLevel + 1].name)]));
    }
    actions.appendChild(el('button', { class:'btn btn-ghost', type:'button', onclick:() => {
      State.currentQ = 0; State.sessionQuestions = pickSession(lv.id);
      State.sessionAnswers = []; State.combo = 0;
      setScreen('question'); startAmbient(lv.id); sfx.click();
      announce('Mengulang level ' + lv.name + ' dengan soal baru.');
    }}, [document.createTextNode('🔄 Ulangi (Soal Baru)')]));
    actions.appendChild(el('button', { class:'btn btn-ghost', type:'button', onclick:() => { setScreen('map'); sfx.click(); } }, [document.createTextNode('🗺️ Peta Misi')]));
    actions.appendChild(el('button', { class:'btn btn-ghost', type:'button', onclick:() => window.print() }, [document.createTextNode('🖨️ Cetak Hasil')]));
    card.appendChild(actions);

    const recap = el('div', { style:'margin-top:24px;text-align:left' });
    recap.appendChild(el('div', { class:'section-title', style:'margin-bottom:10px', text:'Rekap Per Lapisan' }));
    LEVELS.forEach(l => {
      const r = State.results[l.id];
      const done = !!r;
      const line = el('div', { style:'display:flex;justify-content:space-between;padding:10px 12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;font-size:13px' });
      line.appendChild(el('span', { text: l.icon + ' ' + l.name }));
      line.appendChild(el('span', { style:'color:' + (done ? 'var(--accent)' : 'var(--muted)'), text: done ? (r.correct + '/' + r.total + ' benar') : 'Belum dimainkan' }));
      recap.appendChild(line);
    });
    card.appendChild(recap);

    wrap.appendChild(card); stage.appendChild(wrap);

    if(pct >= 80) setTimeout(() => burst(window.innerWidth/2, window.innerHeight*0.3, ['#fbbf24','#63e6ff','#a78bfa','#34d399']), 200);
    announce('Level selesai. ' + sessionCorrect + ' benar, ' + sessionUnknown + ' belum tahu.');
  }

  function rocketTransition(nextName, callback){
    const overlay = $('#rocket');
    $('#rocketLevel').textContent = 'NAIK KE ' + nextName.toUpperCase();
    const icon = overlay.querySelector('.rocket-icon');
    icon.style.animation = 'none'; void icon.offsetWidth; icon.style.animation = '';
    $('#rocketLevel').style.animation = 'none'; void $('#rocketLevel').offsetWidth; $('#rocketLevel').style.animation = '';
    overlay.classList.add('active');
    if(State.soundOn){
      const ctx = ensureAudio();
      if(ctx){
        if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(120, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 1.8);
        g.gain.setValueAtTime(0.05, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 2.2);
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + 2.4);
      }
    }
    setTimeout(() => { overlay.classList.remove('active'); setTimeout(callback, 350); }, 2400);
  }

  /* ================= GLOSSARY ================= */
  function buildGlossary(){
    const box = $('#glossary'); box.innerHTML = '';
    GLOSSARY.forEach(g => {
      const d = el('div');
      d.appendChild(el('b', { text: g.t }));
      d.appendChild(document.createTextNode(g.d));
      box.appendChild(d);
    });
  }
  let drawerOpen = false;
  function openDrawer(){ const d = $('#drawer'); d.classList.add('open'); d.setAttribute('aria-hidden','false'); drawerOpen = true; $('#closeDrawer').focus(); }
  function closeDrawer(){ const d = $('#drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden','true'); drawerOpen = false; stage.focus(); }
  $('#closeDrawer').addEventListener('click', closeDrawer);

  /* ================= EVENTS ================= */
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && drawerOpen){ closeDrawer(); return; }
    if(drawerOpen) return;
    if(State.screen === 'question'){
      const n = parseInt(e.key, 10);
      if(n >= 1 && n <= 4){
        const opts = $$('.opt');
        if(opts[n-1] && !opts[n-1].disabled){ selectOption(n-1); opts[n-1].focus(); }
        e.preventDefault();
      } else if(e.key === 'Enter'){
        const btn = $('#submitBtn');
        if(btn && !btn.disabled){ btn.click(); e.preventDefault(); }
      } else if(e.key === '?'){
        const ub = $('#unknownBtn');
        if(ub && !ub.disabled){ ub.click(); e.preventDefault(); }
      } else if(/^[a-dA-D]$/.test(e.key)){
        const idx = 'abcd'.indexOf(e.key.toLowerCase());
        const opts = $$('.opt');
        if(opts[idx] && !opts[idx].disabled){ selectOption(idx); opts[idx].focus(); }
        e.preventDefault();
      }
    } else if(State.screen === 'map' || State.screen === 'result' || State.screen === 'start'){
      if(e.key === 'g' || e.key === 'G') openDrawer();
    }
  });

  $('#soundBtn').addEventListener('click', () => {
    State.soundOn = !State.soundOn;
    if(State.soundOn){ ensureAudio(); sfx.click(); if(State.screen === 'question') startAmbient(LEVELS[State.currentLevel].id); }
    else { stopAmbient(); }
    updateHUD(); save();
    announce(State.soundOn ? 'Suara dinyalakan' : 'Suara dimatikan');
  });

  $('#switchBtn').addEventListener('click', () => {
    save(); stopAmbient();
    State = defaultState(); State.screen = 'start';
    render(); updateHUD();
    announce('Ganti pemain.');
  });

  $('#resetBtn').addEventListener('click', () => {
    if(confirm('Reset progres untuk akun "' + State.playerName + '"?')){
      clearSave(); State = defaultState(); stopAmbient(); updateHUD(); setScreen('start');
      announce('Progres direset.');
    }
  });

  window.addEventListener('online', () => announce('Kembali online.'));
  window.addEventListener('offline', () => announce('Game tetap jalan offline.'));

  /* ================= BOOT SEQUENCE ================= */
  function runBoot(){
    const boot = $('#boot');
    const fill = $('#bootFill');
    const txt = $('#bootText');
    const steps = ['MEMUAT BANK SOAL','MENYIAPKAN LAPISAN','KALIBRASI ALTIMETER','MENGAKTIFKAN PROFESOR','SIAP'];
    let i = 0;
    const tick = () => {
      if(i >= steps.length){
        setTimeout(() => { boot.classList.add('hidden'); setTimeout(()=>{ boot.style.display = 'none'; }, 900); }, 200);
        return;
      }
      txt.textContent = steps[i];
      fill.style.width = ((i+1)/steps.length*100) + '%';
      i++;
      setTimeout(tick, 350 + Math.random()*250);
    };
    tick();
  }

  /* ================= BOOT ================= */
  function boot(){
    allProfiles = loadAllProfiles();
    const activeName = (() => { try{ return localStorage.getItem(ACTIVE_KEY); }catch(e){ return null; } })();
    if(activeName && allProfiles[activeName] && allProfiles[activeName].playerName){
      const restored = Object.assign(defaultState(), allProfiles[activeName]);
      restored.screen = 'map'; restored.soundOn = true;
      State = restored;
    } else { State = defaultState(); }
    buildGlossary();
    updateHUD();
    render();
    $('#footYear').textContent = new Date().getFullYear();
    runBoot();
  }
  boot();

})();
</script>
</body>
</html>
